services:
  - type: web
    name: gearup-api
    env: node
    plan: free
    buildCommand: (pnpm install --frozen-lockfile || pnpm install) && pnpm prisma:generate && pnpm build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gearup-db
          propertyName: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SALT_ROUNDS
        value: 10
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://gearup-backend-2.onrender.com

databases:
  - name: gearup-db
    plan: free
    databaseName: gearup_db
    user: gearup_user
