version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gearup-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gearup_user:gearup_password@postgres:5432/gearup_db?schema=public
      - JWT_SECRET=supersecretproductionjwtkeyminimum32characterslong
      - JWT_EXPIRES_IN=7d
      - SALT_ROUNDS=10
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_BASE_URL=http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gearup-network

  postgres:
    image: postgres:16-alpine
    container_name: gearup-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gearup_user
      POSTGRES_PASSWORD: gearup_password
      POSTGRES_DB: gearup_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearup_user -d gearup_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gearup-network

networks:
  gearup-network:
    driver: bridge

volumes:
  postgres-data:
